            nome:
              type: string
            telefone:
              type: string
              nullable: true
            email:
              type: string
              nullable: true

    # --- CEMEP ---
    CriarCemepInput:
      type: object
      required: [escola_id]
      properties:
        escola_id:
          type: integer
        comentario:
          type: string
          nullable: true
    AtualizarCemepInput:
      type: object
