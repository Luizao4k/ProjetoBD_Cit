        designacao:
          type: string
          nullable: true
    StarlinkOutput:
      allOf:
        - $ref: "#/components/schemas/_Auditoria"
        - type: object
          properties:
            escola_id:
              type: integer
            designacao:
              type: string

    # --- Responsável ---
    CriarResponsavelInput:
      type: object
      required: [cemep_id, nome]
      properties:
        cemep_id:
          type: integer
        nome:
          type: string
    AtualizarResponsavelInput:
      type: object
      properties:
        nome:
          type: string
          nullable: true
    ResponsavelOutput:
