              type: string

    # --- Turma CEMEP ---
    CriarTurmaCemepInput:
      type: object
      required: [responsavel_id, nome_turma]
      properties:
        responsavel_id:
          type: integer
        nome_turma:
          type: string
    AtualizarTurmaCemepInput:
      type: object
      properties:
        nome_turma:
          type: string
          nullable: true
    TurmaCemepOutput:
      allOf:
        - $ref: "#/components/schemas/_Auditoria"
        - type: object
          properties:
            responsavel_id:
              type: integer
            nome_turma:
              type: string

    # --- Importação ---
    FalhaImportacao:
      type: object
      description: >-
        Uma linha do arquivo que não pôde ser importada (ver
        infrastructure/importacao/erro.py)
      properties:
        numero_linha:
          type: integer
          description: Posição da linha no arquivo de origem (1-based, exclui cabeçalho)
        tipo_erro:
          type: string
          description: Nome da classe da exceção que causou a falha
          example: NomeInvalidoError
        mensagem:
          type: string
          description: Explicação legível do que deu errado nessa linha
        campo:
          type: string
          nullable: true
          description: Coluna que originou o problema, quando identificável
        dados_originais:
          type: object
          description: >-
            A linha crua exatamente como veio do arquivo — o
            suficiente para corrigir e reimportar só essa linha
          additionalProperties:
            type: string
        ocorrido_em:
          type: string
          format: date-time
      required: [numero_linha, tipo_erro, mensagem, dados_originais]

    ResultadoImportacao:
      type: object
      description: >-
        Relatório agregado de uma importação em lote (ver
        infrastructure/importacao/resultado.py)
      properties:
        tipo:
          type: string
          enum:
            [
              dre,
              escolas,
              diretores,
              cemeps,
              chromebooks,
              starlinks,
              responsaveis,
              turmas_cemep,
            ]
        arquivo:
          type: string
          description: Nome original do arquivo enviado
        total_processado:
          type: integer
          description: sucessos + erros
        sucessos:
          type: integer
          description: Quantidade de linhas importadas com sucesso
        erros:
          type: integer
          description: Quantidade de linhas que falharam
        taxa_sucesso:
          type: number
          format: float
          description: Fração entre 0 e 1 (não percentual) — sucessos / total_processado
        resumo:
          type: string
          description: Frase pronta para exibição
          example: >-
            8 registro(s) importado(s) com sucesso, 1 falha(s) (88.9%
            de sucesso, 9 linha(s) processada(s) no total).
        falhas:
          type: array
          items:
            $ref: "#/components/schemas/FalhaImportacao"
      required:
        [tipo, arquivo, total_processado, sucessos, erros, taxa_sucesso, resumo, falhas]

    # --- compartilhado ---
    _Auditoria:
      type: object
      description: Campos presentes em todo Output DTO (AuditoriaEntidade, ver domain/entities/base.py)
      properties:
        id:
          type: integer
        criado_em:
          type: string
          format: date-time
        atualizado_em:
          type: string
          format: date-time
