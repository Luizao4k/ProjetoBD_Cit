    CriarDiretorInput:
      type: object
      required: [escola_id, nome]
      properties:
        escola_id:
          type: integer
        nome:
          type: string
        telefone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
    AtualizarDiretorInput:
      type: object
      description: escola_id não é alterável — trocar a escola de um diretor não é suportado pelo domínio.
      properties:
        nome:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
    DiretorOutput:
      allOf:
        - $ref: "#/components/schemas/_Auditoria"
        - type: object
